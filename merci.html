<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — RelanceSimple</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#070b12;--bg2:#0b1120;--tx:#f1f5f9;--tx2:#94a3b8;--cyan:#22d3ee;--violet:#8b5cf6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .bgfx{position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 420px at 20% -10%,rgba(34,211,238,.16),transparent 60%),radial-gradient(700px 420px at 80% 110%,rgba(139,92,246,.18),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2))}
  .card{background:rgba(16,23,32,.72);border:1px solid rgba(148,163,184,.18);border-radius:22px;padding:44px 38px;max-width:560px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px -30px rgba(0,0,0,.7)}
  .ok{font-size:44px;margin-bottom:14px}
  h1{font-size:clamp(22px,4vw,28px);letter-spacing:-.02em;margin-bottom:12px}
  p{color:var(--tx2);font-size:15px;margin-bottom:8px}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:linear-gradient(135deg,#0891b2,#7c3aed);color:#fff;border-radius:13px;padding:13px 24px;font-size:15px;font-weight:800;text-decoration:none}
  .small{margin-top:18px;font-size:12.5px;color:var(--tx2)}
  .small a{color:#a5f3fc;text-decoration:none}
</style>
</head>
<body>
<div class="bgfx"></div>
<div class="card">
  <div class="ok">✅</div>
  <h1>Merci, c'est noté !</h1>
  <p>Vous êtes sur la liste d'attente de <b>RelanceSimple</b>.</p>
  <p>Vous recevrez le template gratuit par email, et serez informé·e en premier à la sortie.</p>
  <a class="btn" href="assets/relancesimple-template.xlsx" download>📥 Télécharger le template gratuit</a>
  <p class="small">Une question ? <a href="mailto:contact@relancesimple.fr">contact@relancesimple.fr</a></p>
</div>
</body>
</html>
